<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UI 原型</title>
  <!--
    这是原型的**容器**：设计系统、图标库、批注层、状态切换都在本文件里，是固定实现。
    产出原型**不需要读本文件**——按 references/UI原型纪律.md §8 的插槽契约往具名插槽里盲填即可。
    除插槽外的任何一区（THEME / DESIGN-SYSTEM / ICONS / ANNO-FRAMEWORK / ANNOTATIONS）
    MUST NOT 改写、精简或删除。
  -->

  <!-- THEME:BEGIN 默认视觉基线 · 固定实现 · 整段原样保留，MUST NOT 修改或删除
       项目自己的样式依据不改这里，写进下面的 PROJECT-THEME 插槽覆盖即可。 --><!-- THEME:END -->

  <!-- PROJECT-THEME:BEGIN 插槽：项目真实样式依据（覆盖上面的默认基线）。
       自查不到样式来源时整段留空，并在 PRD 里标注为临时视觉假设。 -->
  <style id="project-theme"></style>
  <!-- PROJECT-THEME:END -->

  <!-- DESIGN-SYSTEM:BEGIN 组件样式 · 固定实现 · 整段原样保留，MUST NOT 修改或删除 --><!-- DESIGN-SYSTEM:END -->

  <!-- CUSTOM-CSS:BEGIN 插槽：组件表里没有的控件、hover / 动画 / 媒体查询写这里。
       位置在设计系统之后，覆盖得掉它；取色 MUST 用 var(--…) token。 -->
  <style id="proto-custom"></style>
  <!-- CUSTOM-CSS:END -->

  <!-- ANNO-FRAMEWORK:CSS:BEGIN 批注框架样式 · 固定实现 · 整段原样保留，MUST NOT 修改或删除 --><!-- ANNO-FRAMEWORK:CSS:END -->
</head>
<body>
  <!-- ICONS:BEGIN 图标库（lucide 风格内联 sprite）· 固定实现 · 整段原样保留，MUST NOT 修改或删除
       用法：<svg class="icon"><use href="#i-search"/></svg>；尺寸由 .icon / .icon-sm / .icon-lg 控制。 --><!-- ICONS:END -->

  <header class="prototype-meta">
    <!-- TITLE:BEGIN 插槽：标题用 preview.mjs slot --set title 写（一次写 <title> 与下面的 <h1>），副标题用 --set subtitle -->
    <h1 id="proto-title">UI 原型</h1>
    <p id="proto-subtitle"></p>
    <!-- TITLE:END -->
  </header>

  <div class="anno-notes-panel" id="proto-notes-panel" hidden>
    <div class="anno-notes-panel__inner">
      <!-- NOTES:BEGIN 插槽：用 slot --set notes 写入；外壳由本区提供，片段只写内容 -->
      <div class="anno-notes-body notes-body" id="proto-notes"></div>
      <!-- NOTES:END -->
    </div>
  </div>

  <main class="stage">
    <!-- SCREENS:BEGIN 插槽：本次要画的界面。用 preview.mjs slot --set screens 写入，本区内容整体被替换；外壳由本区提供，片段里 MUST NOT 再包一层 .devices。
         结构约定与可用 class 见 references/UI原型纪律.md §8——不必读本文件。 -->
    <div class="devices" data-anno-canvas><!-- SCREENS --></div>
    <!-- SCREENS:END -->

  </main>

  <!-- SCREEN-SCRIPT:BEGIN 原型级交互 · 固定实现 · 整段原样保留，MUST NOT 修改或删除
       屏注解区状态切换按钮的行为已由本区内置（认 [data-state] 属性），产出方不写一行绑定；
       要在别处改状态用这里导出的 window.setScreenState(screenEl, nextState)。 --><!-- SCREEN-SCRIPT:END -->

  <!-- CUSTOM-JS:BEGIN 插槽：本次原型特有的交互演示写这里，用 slot --set script 写入。
       屏注解区的状态切换按钮 MUST NOT 写进本区——容器已内置其行为，再写一份会重复绑定。 -->
  <script id="proto-script"></script>
  <!-- CUSTOM-JS:END -->

  <!-- ANNOTATIONS:BEGIN 用户批注数据 · 写入方只有三个：页面工具栏、reply 命令、slot 的显式放行路径
       items[].id 与界面里的 data-anno-user="<id>" 一一对应，可据此定位被批注的元素。
       改稿时 MUST 整段保留本块与界面上的 data-anno-user 属性；MUST NOT 手工编辑本块内容。
       取批注的读法见 references/UI原型纪律.md §7.3——本注释刻意不写那条命令：
       命令里含本区结束标记的字样，写在这里会让按标记取段的读法在此提前截断。 -->
  <script type="application/json" id="anno-data">
{
  "schema": "prd-annotations@1",
  "updatedAt": "",
  "global": [],
  "items": [],
  "replies": []
}
  </script>
  <!-- ANNOTATIONS:END -->

  <!-- ANNO-FRAMEWORK:JS:BEGIN 批注框架 · 固定实现 · 整段原样保留，MUST NOT 修改或删除 --><!-- ANNO-FRAMEWORK:JS:END -->
</body>
</html>
